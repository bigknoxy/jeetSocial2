services:
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  moderation-python:
    image: twirapp/toxicity-detector:latest
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/predict?text=healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3

  moderation:
    image: ghcr.io/bigknoxy/jeetsocial2-moderation:latest
    restart: always
    depends_on:
      - moderation-python
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/moderate" ]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    image: ghcr.io/bigknoxy/jeetsocial2-app:latest
    depends_on:
      - moderation
    environment:
      - MODERATION_SERVICE_URL=http://moderation:3001
      - DATABASE_PATH=/app/data/social.db
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/posts" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
