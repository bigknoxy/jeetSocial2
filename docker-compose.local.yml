services:
  moderation:
    build: ./moderation
    ports:
      - "3001:3001"
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/moderate" ]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - moderation
    environment:
      - MODERATION_SERVICE_URL=http://moderation:3001
      - DATABASE_PATH=/app/data/social.db
      - NODE_ENV=development
    volumes:
      - sqlite_data:/app/data
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/posts" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlite_data:
