name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    uses: bigknoxy/.github/.github/workflows/security-reusable.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      language: node
      has_docker: true
      dockerfile: app/Dockerfile
      working_directory: app/server
    secrets: inherit
